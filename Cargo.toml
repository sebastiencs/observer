[workspace]
members = [
    "crates/observer-ingest",
    "crates/observer-protocol",
    "crates/observer-wal",
    "crates/observerd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
