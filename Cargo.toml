[workspace]
members = [
    "crates/observer-ingest",
    "crates/observer-protocol",
    "crates/observer-storage",
    "crates/observer-wal",
    "crates/observerd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[workspace.dependencies]
arrow-array = "60"
arrow-schema = "60"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
blake3 = "1"
bytes = "1"
crc32c = "0.6"
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic", "logs"] }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
proptest = "1"
prost = "0.14.4"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.53.1"
toml = "0.8"
tokio-stream = "0.1"
tonic = "0.14.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
