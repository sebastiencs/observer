[workspace]
members = [
    "crates/observer-ingest",
    "crates/observer-protocol",
    "crates/observer-wal",
    "crates/observerd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[workspace.dependencies]
bytes = "1"
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic", "logs"] }
prost = "0.14.4"
tokio = "1.53.1"
tokio-stream = "0.1"
tonic = "0.14.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
